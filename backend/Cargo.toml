[package]
name = "mcp-backend"
version = "0.1.0"
description = "MCP feature plugin backend for companion-tauri"
license = "MIT"
edition = "2021"

[lib]
name = "mcp_backend"
crate-type = ["cdylib"]

[dependencies]
companion-plugin-sdk = { path = "../../sdk/rust/companion-plugin-sdk" }
# Official Model Context Protocol SDK (client role only). Mirrors the
# dependency spec the host app uses in app/src-tauri/Cargo.toml.
rmcp = { version = "3.5", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
strip = true
